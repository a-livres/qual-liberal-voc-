<script>

const questions = [

{
text: "Qual dessas situações você considera mais perigosa para uma sociedade livre?",

]
},

{
text: "Você precisa escolher UMA prioridade para um país em crise:",
options: [
{ text: "Reduzir desigualdades estruturais imediatamente.", type: "rawls" },
{ text: "Proteger liberdades civis mesmo durante a crise.", type: "mill" },
{ text: "Evitar expansão estatal e preservar mercados livres.", type: "hayek" },
{ text: "Controlar inflação e estabilizar a moeda.", type: "friedman" },
{ text: "Garantir educação, saúde e dignidade mínima para todos.", type: "nussbaum" },
{ text: "Impedir concentração de poder e preservar instituições democráticas.", type: "arendt" }
]
},

{
text: "Sobre liberdade de expressão:",
options: [
{ text: "Ela deve coexistir com justiça social e igualdade política.", type: "rawls" },
{ text: "Ela é essencial até para opiniões ofensivas ou impopulares.", type: "mill" },
{ text: "Tentativas de controlar discurso frequentemente levam ao autoritarismo.", type: "hayek" },
{ text: "A liberdade econômica fortalece a liberdade de expressão.", type: "friedman" },
{ text: "Expressão sem acesso real à educação e cultura é limitada.", type: "nussbaum" },
{ text: "O debate público é o coração da liberdade política.", type: "arendt" }
]
},

{
text: "Uma universidade decide censurar palestras consideradas ofensivas. Sua reação mais próxima seria:",
options: [
{ text: "Isso pode ser aceitável se proteger grupos historicamente vulneráveis.", type: "rawls" },
{ text: "Mesmo ideias ruins devem poder ser debatidas livremente.", type: "mill" },
{ text: "Instituições começam assim e terminam normalizando censura política.", type: "hayek" },
{ text: "Mercados livres de ideias funcionam melhor sem interferência.", type: "friedman" },
{ text: "O foco deveria ser garantir inclusão e acesso amplo ao debate.", type: "nussbaum" },
{ text: "Eliminar o debate público é abrir espaço para autoritarismo.", type: "arendt" }
]
},

{
text: "Qual dessas afirmações parece MAIS correta para você?",
options: [
{ text: "Uma sociedade justa deve beneficiar principalmente os menos favorecidos.", type: "rawls" },
{ text: "A individualidade humana é indispensável para o progresso.", type: "mill" },
{ text: "Nenhum planejador central possui informação suficiente para controlar a sociedade.", type: "hayek" },
{ text: "Mercados competitivos produzem mais prosperidade e liberdade.", type: "friedman" },
{ text: "Sem capacidades reais, liberdade é apenas formalidade.", type: "nussbaum" },
{ text: "Liberdade política depende da existência de espaço público ativo.", type: "arendt" }
]
},

{
text: "Qual dessas políticas você MAIS apoiaria?",
options: [
{ text: "Forte redistribuição de renda e igualdade de oportunidades.", type: "rawls" },
{ text: "Proteção radical da liberdade individual e de expressão.", type: "mill" },
{ text: "Privatizações amplas e limitação severa do Estado.", type: "hayek" },
{ text: "Controle monetário rígido e redução de impostos.", type: "friedman" },
{ text: "Expansão massiva de educação pública e saúde universal.", type: "nussbaum" },
{ text: "Fortalecimento das instituições democráticas e participação cidadã.", type: "arendt" }
]
},

{
text: "O que mais define uma sociedade verdadeiramente livre?",
options: [
{ text: "Justiça social e igualdade de oportunidades.", type: "rawls" },
{ text: "Autonomia individual e pluralidade de estilos de vida.", type: "mill" },
{ text: "Mercados livres e limitação do poder estatal.", type: "hayek" },
{ text: "Liberdade econômica e estabilidade monetária.", type: "friedman" },
{ text: "Capacidade concreta de viver com dignidade.", type: "nussbaum" },
{ text: "Participação política ativa e pluralismo democrático.", type: "arendt" }
]
}

];

// embaralhar perguntas
questions.sort(() => Math.random() - 0.5);

let currentQuestion = 0;

let scores = {
rawls: 0,
mill: 0,
hayek: 0,
friedman: 0,
nussbaum: 0,
arendt: 0
};

function loadQuestion() {

const q = questions[currentQuestion];

document.getElementById("question-text").innerText = q.text;

const optionsContainer = document.getElementById("options-container");

optionsContainer.innerHTML = "";

q.options.forEach(option => {

const btn = document.createElement("button");

btn.innerText = option.text;

btn.onclick = () => selectOption(option.type);

optionsContainer.appendChild(btn);

});

document.getElementById("progress").style.width =
((currentQuestion / questions.length) * 100) + "%";
}

function selectOption(type) {

scores[type]++;

currentQuestion++;

if(currentQuestion < questions.length) {
loadQuestion();
} else {
showResult();
}

}

function showResult() {

document.getElementById("quiz-ui").style.display = "none";

document.getElementById("result").style.display = "block";

let winner = Object.keys(scores).reduce((a, b) =>
scores[a] > scores[b] ? a : b
);

const results = {

rawls: {
title: "John Rawls",
desc: "Você valoriza justiça distributiva, igualdade de oportunidades e instituições voltadas para proteger os menos favorecidos.",
image: "https://upload.wikimedia.org/wikipedia/commons/5/50/John_Rawls_1971.jpg"
},

mill: {
title: "John Stuart Mill",
desc: "Você prioriza liberdade individual, pluralidade de opiniões e autonomia humana.",
image: "https://upload.wikimedia.org/wikipedia/commons/9/96/John_Stuart_Mill_by_London_Stereoscopic_Company%2C_c1870.jpg"
},

hayek: {
title: "Friedrich Hayek",
desc: "Você acredita em ordem espontânea, livre mercado e limitação do poder estatal.",
image: "https://upload.wikimedia.org/wikipedia/commons/7/79/Friedrich_Hayek_portrait.jpg"
},

friedman: {
title: "Milton Friedman",
desc: "Você valoriza liberdade econômica, estabilidade monetária e mercados competitivos.",
image: "https://upload.wikimedia.org/wikipedia/commons/7/79/Milton_Friedman.jpg"
},

nussbaum: {
title: "Martha Nussbaum",
desc: "Você acredita que dignidade humana e capacidades reais devem ser o centro da política.",
image: "https://upload.wikimedia.org/wikipedia/commons/0/0f/Martha_Nussbaum_2010.jpg"
},

arendt: {
title: "Hannah Arendt",
desc: "Você valoriza democracia, pluralismo e resistência ao autoritarismo.",
image: "https://upload.wikimedia.org/wikipedia/commons/b/b1/Hannah_Arendt_1975.jpg"
}

};

document.getElementById("result-text").innerText =
results[winner].title;

document.getElementById("result-desc").innerText =
results[winner].desc;

document.getElementById("result-image").src =
results[winner].image;

document.getElementById("progress").style.width = "100%";

}

loadQuestion();

</script>

</body>
</html>
"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("index.html criado com sucesso!")
